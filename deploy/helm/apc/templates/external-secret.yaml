{{- if .Values.externalSecrets.enabled }}
{{- $adminSecretName := .Values.externalSecrets.admin.name | default (printf "%s-admin" (include "apc-action-security.fullname" .)) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "apc-action-security.fullname" . }}-admin
  labels:
    {{- include "apc-action-security.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ default "ClusterSecretStore" .Values.externalSecrets.admin.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecrets.admin.secretStoreRef.name | quote }}
  target:
    name: {{ $adminSecretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.auth.secretKey | quote }}
      remoteRef:
        key: {{ .Values.externalSecrets.admin.remoteKey | quote }}
        property: {{ default "token" .Values.externalSecrets.admin.remoteProperty | quote }}
{{- end }}
