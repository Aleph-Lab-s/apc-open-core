{{- if .Values.ingress.enabled }}
{{- if eq (len .Values.ingress.tls) 0 }}{{ fail "ingress.enabled=true requires explicit TLS configuration; terminate TLS at the approved edge and do not expose the runtime's plain HTTP port directly to the internet." }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "apc-action-security.fullname" . }}
  labels:
    {{- include "apc-action-security.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "apc-action-security.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
