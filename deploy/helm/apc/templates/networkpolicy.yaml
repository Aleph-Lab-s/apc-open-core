{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "apc-action-security.fullname" . }}
  labels:
    {{- include "apc-action-security.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "apc-action-security.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if or .Values.networkPolicy.ingress.from .Values.networkPolicy.ingress.allowedCIDRs }}
  ingress:
    {{- if .Values.networkPolicy.ingress.from }}
    - from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8787
    {{- end }}
    {{- range .Values.networkPolicy.ingress.allowedCIDRs }}
    - from:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 8787
    {{- end }}
  {{- end }}
  {{- if or .Values.networkPolicy.egress.allowDNS .Values.networkPolicy.egress.additionalRules }}
  egress:
    {{- if .Values.networkPolicy.egress.allowDNS }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with .Values.networkPolicy.egress.additionalRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
