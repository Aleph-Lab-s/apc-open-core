name: "MCP Security"
description: "Installs APC and runs local health, integration-catalog and evidence-store checks."
author: "Aleph Labs"
inputs:
  python-version:
    description: "Python version used to install APC."
    required: false
    default: "3.13"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install APC alpha
      shell: bash
      env:
        APC_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --disable-pip-version-check "${APC_ACTION_PATH}[mcp]"
    - name: Run local runtime smoke checks
      shell: bash
      env:
        APC_MODE: DEMO
        APC_DB_PATH: ${{ runner.temp }}/apc-action-smoke.db
        PYTHONDONTWRITEBYTECODE: "1"
      run: |
        python -c "from mcp.server import MCPServer; print('MCP SDK v2 import OK')"
        apc doctor
        apc integrations
        apc evidence-verify
branding:
  icon: "shield"
  color: "blue"
